# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zrap100ih
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: abap-cloud-default_abap-trial-9ae2b70atrial-dev
          url: https://5bff2ab7-3ad1-48e3-8980-53a354a1b276.abap.us10.hana.ondemand.com/
          scp: true
        app:
          name: ZRAP100_IH
          package: zflight_ih
          transport: ''
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
